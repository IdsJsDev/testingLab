[package]
name = "uav-test-station"
version = "0.1.0"
description = "UAV test and calibration station"
authors = ["UAV Test Station contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "uav_test_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-ardupilotmega", "transport-direct-serial"] }
parking_lot = "0.12"
rand = "0.10.2"
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["net", "sync", "rt", "time"] }
tokio-util = "0.7.19"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
