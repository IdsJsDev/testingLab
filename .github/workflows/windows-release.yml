name: Windows release

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  should-build:
    name: Check whether a release is missing
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Checkout current main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip scheduled rebuild when this commit is already released
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          if git tag --points-at HEAD | grep -q '^windows-v'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows x64
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Number and collect Windows builds
        id: release
        shell: pwsh
        run: |
          $appVersion = node -p "require('./package.json').version"
          $releaseNumber = "v$appVersion-build.${{ github.run_number }}"
          $releaseDirectory = "release/windows"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          $bundles = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" }

          if (-not $bundles) {
            throw "Tauri did not produce an MSI or EXE installer"
          }

          $portableExecutable = "src-tauri/target/x86_64-pc-windows-msvc/release/uav-test-station.exe"
          if (-not (Test-Path $portableExecutable)) {
            throw "Tauri did not produce the portable application executable"
          }

          foreach ($bundle in $bundles) {
            $bundleType = $bundle.Directory.Name.ToLowerInvariant()
            $destination = Join-Path $releaseDirectory "UAV-Test-Station-$releaseNumber-$bundleType$($bundle.Extension)"
            Copy-Item $bundle.FullName $destination
          }

          Copy-Item $portableExecutable (Join-Path $releaseDirectory "UAV-Test-Station-$releaseNumber-portable.exe")

          "number=$releaseNumber" >> $env:GITHUB_OUTPUT
          "tag=windows-$releaseNumber" >> $env:GITHUB_OUTPUT

      - name: Upload numbered build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.release.outputs.number }}
          path: release/windows/*
          if-no-files-found: error
          retention-days: 90

      - name: Create permanent GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" release/windows/* `
            --title "UAV Test Station ${{ steps.release.outputs.number }}" `
            --notes "Automatic Windows x64 build from commit ${{ github.sha }}." `
            --target "${{ github.sha }}" `
            --prerelease
